# Push a tag like v0.1.0 to build the Windows app + addon zip and publish a GitHub Release.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: app

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run package

      - name: Zip the addon
        working-directory: addon
        shell: pwsh
        run: Compress-Archive -Path LovenseLink -DestinationPath ../app/release/LovenseLink-addon.zip -Force

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/release/*.exe
            app/release/LovenseLink-addon.zip
          generate_release_notes: true
